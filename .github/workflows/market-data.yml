name: Update market data

on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_quotes.py"
      - ".github/workflows/market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TWSE and Yahoo Finance quotes
        run: python scripts/update_quotes.py
      - name: Commit refreshed quote cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git diff --cached --quiet || git commit -m "chore: refresh market quotes"
          git push
